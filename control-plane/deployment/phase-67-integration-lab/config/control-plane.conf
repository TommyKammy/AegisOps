upstream phase67_control_plane {
  server control-plane:8080;
  keepalive 16;
}

server {
  listen 8443 ssl default_server;
  server_name localhost;

  ssl_certificate /etc/nginx/certs/lab.crt;
  ssl_certificate_key /etc/nginx/certs/lab.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-AegisOps-Proxy-Secret "";
  proxy_set_header X-AegisOps-Proxy-Service-Account "";
  proxy_set_header X-AegisOps-Authenticated-IdP "";
  proxy_set_header X-AegisOps-Authenticated-Subject "";
  proxy_set_header X-AegisOps-Authenticated-Identity "";
  proxy_set_header X-AegisOps-Authenticated-Role "";

  location = /healthz {
    proxy_pass http://phase67_control_plane/healthz;
  }

  location = /readyz {
    proxy_pass http://phase67_control_plane/readyz;
  }

  location = /runtime {
    proxy_pass http://phase67_control_plane/runtime;
  }

  location / {
    return 404;
  }
}

server {
  listen 8443 ssl;
  server_name wazuh.localhost;

  ssl_certificate /etc/nginx/certs/lab.crt;
  ssl_certificate_key /etc/nginx/certs/lab.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  resolver 127.0.0.11 ipv6=off valid=10s;
  set $phase67_wazuh_dashboard https://wazuh-dashboard:5601;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $phase67_connection_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_name wazuh.dashboard;
    proxy_ssl_verify off;
    proxy_pass $phase67_wazuh_dashboard;
  }
}

server {
  listen 8443 ssl;
  server_name shuffle.localhost;

  ssl_certificate /etc/nginx/certs/lab.crt;
  ssl_certificate_key /etc/nginx/certs/lab.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  resolver 127.0.0.11 ipv6=off valid=10s;
  set $phase67_shuffle_frontend http://shuffle-frontend:80;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $phase67_connection_upgrade;
    proxy_pass $phase67_shuffle_frontend;
  }
}
